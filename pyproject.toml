[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridzilla"
version = "0.1.0"
description = "Bounded llm-d/EPP signal-routing benchmark and evidence UI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gridzilla = "gridzilla.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
